[package]
name = "astro_block"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ash = "0.38"
ash-window = "0.13"
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
env_logger = "0.11.11"
glam = { version = "0.34.2", features = ["bytemuck"] }
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }
log = "0.4.35"
winit = "0.30"

[build-dependencies]
naga = { version = "30.0.1", features = ["glsl-in", "spv-out", "wgsl-in"] }  # wgsl-in: works around a naga 30 feature-gating bug in glsl-in

# Our own crate gets light optimization in dev (fast compile, playable framerate);
# dependencies are fully optimized since they rarely recompile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
